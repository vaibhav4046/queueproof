packages:
  - "."

overrides:
  "@hono/node-server": "2.0.10"
  "postcss": "8.5.18"
  "sharp": "0.35.0"

# Sites installs with pnpm's strict build-script policy. These packages are direct or
# transitive build tools required by Vite/Workers; every resolved version is pinned by
# pnpm-lock.yaml and checked by the Sites supply-chain verifier before installation.
# pnpm 10.32+ writes this map from `pnpm approve-builds`; using its current shape keeps
# the policy effective on both pnpm 10 and pnpm 11.
allowBuilds:
  "esbuild": true
  "unrs-resolver": true
  "workerd": true
