name: Apply strict stale bridge repair

on:
  push:
    branches:
      - agent/final-v3-retrieval-fix

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-v3-bridge]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply strict bridge patch
        run: python scripts/patch-final-v3-bridge.py
      - name: Focused synthesis regressions
        run: pnpm exec vitest run tests/final-v3-retrieval-fix.test.ts tests/synthesis.test.ts --pool=threads --maxWorkers=1 --fileParallelism=false
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Commit verified fix
        run: |
          git config user.name "QueueProof Release Bot"
          git config user.email "115102797+vaibhav4046@users.noreply.github.com"
          git add lib/server/synthesis.ts tests/synthesis.test.ts tests/final-v3-retrieval-fix.test.ts
          git commit -m "Require independent open-state bridge proof [patched-v3-bridge]"
          git push origin HEAD:agent/final-v3-retrieval-fix
