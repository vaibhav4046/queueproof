name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type, lint, test, benchmark, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # QueueProof deploys the production dependency graph to Vercel. Cloudflare
      # compatibility and CSS build tooling remain development-only and are not
      # shipped in the production runtime.
      - name: Reject production dependency advisories
        run: pnpm audit:dependencies

      - name: Verify full-history secret-scan guard
        run: node scripts/test-secret-scan.mjs

      - name: Scan candidate tree and reachable history for credentials
        run: pnpm scan:secrets

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run automated tests
        run: pnpm test

      - name: Run deterministic router benchmark
        run: pnpm benchmark:router

      - name: Build production application
        run: pnpm build

      - name: Verify deployment bindings
        run: pnpm deploy:check
