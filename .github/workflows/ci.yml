name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type, lint, test, benchmark, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject moderate, high, or critical dependency advisories
        run: pnpm audit --audit-level moderate

      - name: Scan candidate tree and reachable history for credentials
        run: pnpm scan:secrets

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run automated tests
        run: pnpm test

      - name: Run deterministic router benchmark
        run: pnpm benchmark:router

      - name: Build production application
        run: pnpm build

      - name: Verify deployment bindings
        run: pnpm deploy:check
